name: Build Native iOS App (.ipa) for iPhone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build SmartGimbal_Pro.ipa on macOS Xcode
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project via XcodeGen
        working-directory: ios_app
        run: xcodegen generate

      - name: Compile Native iOS App (Release arm64)
        working-directory: ios_app
        run: |
          xcodebuild -project SmartGimbalPro.xcodeproj             -scheme SmartGimbalPro             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into SmartGimbal_Pro.ipa
        working-directory: ios_app
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SmartGimbalPro.app Payload/
          zip -r SmartGimbal_Pro.ipa Payload

      - name: Upload SmartGimbal_Pro.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartGimbal_Pro_iOS_IPA
          path: ios_app/SmartGimbal_Pro.ipa
          retention-days: 30
