name: SmartGimbalPro
options:
  bundleIdPrefix: com.smartgimbal
  deploymentTarget:
    iOS: "16.0"
targets:
  SmartGimbalPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "T-Flow Pro"
        CFBundleShortVersionString: "2.4.1"
        CFBundleVersion: "241"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Ứng dụng cần quyền truy cập Camera để quay phim 4K và chạy bám nét AI Vision."
        NSMicrophoneUsageDescription: "Ứng dụng cần quyền Micro để thu âm video và điều khiển bằng giọng nói."
        NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền truy cập Thư viện ảnh để lưu trữ và hiển thị ảnh, video 4K đã quay từ Gimbal."
        NSPhotoLibraryAddUsageDescription: "Ứng dụng cần quyền lưu video và ảnh chụp vào Thư viện của bạn."
        NSBluetoothAlwaysUsageDescription: "Ứng dụng cần quyền Bluetooth BLE 5.3 để kết nối và điều khiển động cơ Gimbal 3 trục FOC."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.googleusercontent.apps.725853259455-83tapd22sn2en4cht3jdiaa0ehn734ac
            CFBundleURLSchemes:
              - com.googleusercontent.apps.725853259455-83tapd22sn2en4cht3jdiaa0ehn734ac
              - tflow
    entitlements:
      path: Sources/SmartGimbalPro.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartgimbal.s1pro
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
