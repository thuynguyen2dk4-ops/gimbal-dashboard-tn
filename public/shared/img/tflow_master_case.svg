<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="caseBg" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F6"/>
    </radialGradient>
    <linearGradient id="caseOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35383F"/>
      <stop offset="50%" stop-color="#1E2025"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="caseFoam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#272A31"/>
      <stop offset="100%" stop-color="#181A1E"/>
    </linearGradient>
    <filter id="caseShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0B0D12" flood-opacity="0.16"/>
    </filter>
  </defs>
  <ellipse cx="300" cy="468" rx="188" ry="18" fill="#0B0D12" opacity="0.11"/>
  <!-- Handle top -->
  <path d="M242 138 C242 114, 358 114, 358 138" fill="none" stroke="#1E2025" stroke-width="18" stroke-linecap="round"/>
  <path d="M242 138 C242 114, 358 114, 358 138" fill="none" stroke="#454954" stroke-width="6" stroke-linecap="round"/>
  <!-- Hard Case Outer Aluminum Shell -->
  <g filter="url(#caseShadow)">
