  <rect x="156" y="184" width="136" height="224" rx="20" fill="#101216" stroke="#2D313B" stroke-width="1.5"/>
  <rect x="184" y="210" width="80" height="34" rx="10" fill="#2A2E37"/>
  <rect x="208" y="242" width="32" height="136" rx="10" fill="#252931"/>
  <!-- Slot 2: Tripod -->
  <rect x="314" y="184" width="60" height="224" rx="16" fill="#101216" stroke="#2D313B" stroke-width="1.5"/>
  <rect x="330" y="214" width="28" height="164" rx="8" fill="#262A32"/>
  <!-- Slot 3 & 4: AI Eye + Mic/Cable Compartment -->
  <rect x="394" y="184" width="54" height="102" rx="14" fill="#101216" stroke="#2D313B" stroke-width="1.5"/>
  <circle cx="421" cy="235" r="16" fill="#2A2E37" stroke="#4D5361" stroke-width="1.5"/>
  <rect x="394" y="306" width="54" height="102" rx="14" fill="#101216" stroke="#2D313B" stroke-width="1.5"/>
  <rect x="408" y="328" width="26" height="58" rx="6" fill="#262A32"/>
  <text x="300" y="532" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" fill="#6E6E73">T-FLOW MASTER FLIGHT CASE • IP67 CNC</text>
