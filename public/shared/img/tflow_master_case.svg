    <!-- Inner Custom Cut EVA Foam -->
    <rect x="128" y="158" width="344" height="276" rx="18" fill="url(#caseFoam)" stroke="#3B3F4A" stroke-width="1.5"/>
  </g>
  <!-- Corner CNC Bumpers -->
  <rect x="108" y="138" width="32" height="32" rx="8" fill="#3D414B"/>
  <rect x="460" y="138" width="32" height="32" rx="8" fill="#3D414B"/>
  <rect x="108" y="422" width="32" height="32" rx="8" fill="#3D414B"/>
  <rect x="460" y="422" width="32" height="32" rx="8" fill="#3D414B"/>
  <!-- Recessed CNC Latches -->
  <rect x="176" y="446" width="44" height="14" rx="4" fill="#6E7380"/>
  <rect x="380" y="446" width="44" height="14" rx="4" fill="#6E7380"/>
