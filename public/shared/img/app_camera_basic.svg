<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <!-- Scenic Cinematic Sunset Viewfinder -->
    <linearGradient id="skyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="45%" stop-color="#243B55" />
      <stop offset="85%" stop-color="#C06C84" />
      <stop offset="100%" stop-color="#F8B195" />
    </linearGradient>
    <linearGradient id="seaDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E4862" />
      <stop offset="40%" stop-color="#352342" />
      <stop offset="100%" stop-color="#0F101A" />
    </linearGradient>
    <linearGradient id="sunDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3CD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F8B195" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C06C84" stop-opacity="0" />
    </linearGradient>

    <!-- Scenic Beach Sunny Light Mode -->
    <linearGradient id="skyLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EA8FE" />
      <stop offset="50%" stop-color="#B6D4FE" />
      <stop offset="100%" stop-color="#FFF3CD" />
    </linearGradient>
    <linearGradient id="seaLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CB8C4" />
      <stop offset="50%" stop-color="#3CD070" />
      <stop offset="100%" stop-color="#1B6F7A" />
    </linearGradient>

    <!-- Apple Frosted Glasses -->
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2E" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F2F2F7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="shutterRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="softShadowL" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
</defs>
  <rect width="393" height="852" fill="#000000" rx="54" />

  <!-- 99% Viewfinder (Zero Clutter, Zero Numbers) -->
  <g id="Viewfinder_Basic_Dark">
    <rect x="0" y="0" width="393" height="520" fill="url(#skyDark)" />
    <circle cx="200" cy="420" r="90" fill="url(#sunDark)" />
    <circle cx="200" cy="420" r="30" fill="#FFFBF0" />
    <path d="M0 450 Q 100 410, 200 440 T 393 430 L 393 520 L 0 520 Z" fill="#20152B" opacity="0.8" />
    <rect x="0" y="500" width="393" height="200" fill="url(#seaDark)" />
    <ellipse cx="200" cy="520" rx="140" ry="10" fill="#FCE38A" opacity="0.35" />
  </g>

  <!-- Top Dynamic Island & Status Bar -->
  <rect x="136" y="11" width="121" height="35" rx="17.5" fill="#000000" />
  <text x="52" y="32" font-family="-apple-system, SF Pro Text, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">9:41</text>
  <g transform="translate(325, 20)">
    <path d="M0 11 L 3 11 L 3 7 L 0 7 Z M 5 11 L 8 11 L 8 4 L 5 4 Z M 10 11 L 13 11 L 13 1 L 10 1 Z" fill="#FFFFFF" />
    <rect x="18" y="1" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <rect x="20" y="3" width="15" height="7" rx="1.5" fill="#30D158" />
  </g>

  <!-- Top Bar: ONLY 2 Minimalist Buttons (Flash & UI Customizer Settings) -->
  <g id="Top_Controls" transform="translate(24, 60)">
    <!-- Flash Auto -->
    <circle cx="20" cy="20" r="20" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
    <text x="20" y="25" font-family="-apple-system, SF Pro Text, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">⚡</text>

    <!-- UI Customizer Gear (Tap to Switch Basic/Pro & Light/Dark) -->
    <g transform="translate(305, 0)">
      <circle cx="20" cy="20" r="20" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
      <text x="20" y="25" font-family="-apple-system, SF Pro Text, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">⚙️</text>
    </g>

    <!-- Discreet Gimbal Battery Indicator Pill -->
    <g transform="translate(130, 4)">
      <rect width="85" height="28" rx="14" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
      <circle cx="16" cy="14" r="3.5" fill="#30D158" />
      <text x="48" y="18" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gimbal</text>
    </g>
  </g>

  <!-- Zoom Dial: ONLY 2 Buttons (.5 & 1x) -->
  <g id="Zoom_Pill" transform="translate(141, 620)">
    <rect width="111" height="36" rx="18" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
    <text x="28" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">.5</text>
    <circle cx="80" cy="18" r="14" fill="#FFFFFF" fill-opacity="0.25" />
    <text x="80" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1x</text>
  </g>

  <!-- Bottom Dock (Solid Pure Black) -->
  <g id="Bottom_Dock_Basic">
    <rect x="0" y="670" width="393" height="182" fill="#000000" />

    <!-- Mode Carousel: ONLY Video & Photo -->
    <g transform="translate(0, 695)">
      <text x="145" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="700" fill="#FF9F0A" text-anchor="middle">VIDEO</text>
      <circle cx="145" cy="8" r="2" fill="#FF9F0A" />
      <text x="248" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#8E8E93" text-anchor="middle">PHOTO</text>
    </g>

    <!-- Controls Row -->
    <g transform="translate(0, 725)">
      <!-- Left: Gallery -->
      <g transform="translate(36, 12)">
        <rect width="48" height="48" rx="12" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <rect x="3" y="3" width="42" height="42" rx="9" fill="url(#skyDark)" />
      </g>

      <!-- Center: Massive Shutter Button -->
      <g transform="translate(160, 0)">
        <circle cx="36" cy="36" r="36" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
        <rect x="16" y="16" width="40" height="40" rx="10" fill="url(#shutterRed)" />
      </g>

      <!-- Right: Flip Camera -->
      <g transform="translate(309, 12)">
        <circle cx="24" cy="24" r="24" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <path d="M 15 22 C 15 17, 19 14, 25 14 C 30 14, 33 17, 33 21" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
        <polyline points="30,19 33,22 36,19" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 33 26 C 33 31, 29 34, 23 34 C 18 34, 15 31, 15 27" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
        <polyline points="18,29 15,26 12,29" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <rect x="127" y="836" width="139" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>
</svg>