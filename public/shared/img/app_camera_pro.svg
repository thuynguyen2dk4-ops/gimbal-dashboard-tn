<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <!-- Scenic Cinematic Sunset Viewfinder -->
    <linearGradient id="skyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="45%" stop-color="#243B55" />
      <stop offset="85%" stop-color="#C06C84" />
      <stop offset="100%" stop-color="#F8B195" />
    </linearGradient>
    <linearGradient id="seaDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E4862" />
      <stop offset="40%" stop-color="#352342" />
      <stop offset="100%" stop-color="#0F101A" />
    </linearGradient>
    <linearGradient id="sunDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3CD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F8B195" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C06C84" stop-opacity="0" />
    </linearGradient>

    <!-- Scenic Beach Sunny Light Mode -->
    <linearGradient id="skyLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EA8FE" />
      <stop offset="50%" stop-color="#B6D4FE" />
      <stop offset="100%" stop-color="#FFF3CD" />
    </linearGradient>
    <linearGradient id="seaLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CB8C4" />
      <stop offset="50%" stop-color="#3CD070" />
      <stop offset="100%" stop-color="#1B6F7A" />
    </linearGradient>

    <!-- Apple Frosted Glasses -->
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2E" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F2F2F7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="shutterRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="softShadowL" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
</defs>
  <rect width="393" height="852" fill="#000000" rx="54" />

  <!-- Cinema Viewfinder with 2.39:1 Letterbox Overlays -->
  <g id="Viewfinder_Pro_Dark">
    <rect x="0" y="0" width="393" height="460" fill="url(#skyDark)" />
    <circle cx="200" cy="380" r="80" fill="url(#sunDark)" />
    <circle cx="200" cy="380" r="26" fill="#FFFBF0" />
    <path d="M0 400 Q 100 360, 200 390 T 393 380 L 393 470 L 0 470 Z" fill="#20152B" opacity="0.8" />
    <rect x="0" y="460" width="393" height="230" fill="url(#seaDark)" />

    <!-- Rule of Thirds Grid -->
    <line x1="131" y1="80" x2="131" y2="670" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
    <line x1="262" y1="80" x2="262" y2="670" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
    <line x1="20" y1="280" x2="373" y2="280" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
    <line x1="20" y1="480" x2="373" y2="480" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />

    <!-- AI Tracking Target Box (Minimal Gold) -->
    <g transform="translate(160, 280)">
      <path d="M 0 15 L 0 0 L 15 0" fill="none" stroke="#FF9F0A" stroke-width="2" />
      <path d="M 55 0 L 70 0 L 70 15" fill="none" stroke="#FF9F0A" stroke-width="2" />
      <path d="M 0 55 L 0 70 L 15 70" fill="none" stroke="#FF9F0A" stroke-width="2" />
      <path d="M 55 70 L 70 70 L 70 55" fill="none" stroke="#FF9F0A" stroke-width="2" />
      <rect x="12" y="-14" width="46" height="12" rx="4" fill="#FF9F0A" />
      <text x="35" y="-5" font-family="-apple-system, SF Pro Text, sans-serif" font-size="8" font-weight="700" fill="#000000" text-anchor="middle">AF-C</text>
    </g>

    <!-- Gimbal Horizon Line -->
    <line x1="120" y1="420" x2="165" y2="420" stroke="#FF9F0A" stroke-width="1.5" />
    <line x1="228" y1="420" x2="273" y2="420" stroke="#FF9F0A" stroke-width="1.5" />
    <circle cx="196" cy="420" r="2.5" fill="#FF9F0A" />
    <text x="196" y="435" font-family="-apple-system, SF Pro Text, sans-serif" font-size="9" font-weight="600" fill="#FF9F0A" text-anchor="middle">0.0°</text>

    <!-- Live RGB Histogram (Small Corner Overlay) -->
    <g transform="translate(20, 560)">
      <rect width="64" height="34" rx="6" fill="#000000" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
      <path d="M 6 28 Q 18 10, 32 20 T 58 28" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
      <text x="32" y="10" font-family="-apple-system, SF Pro Text, sans-serif" font-size="7" font-weight="700" fill="#8E8E93" text-anchor="middle">HISTO</text>
    </g>

    <!-- Dual Audio VU Meters -->
    <g transform="translate(355, 530)">
      <rect width="18" height="64" rx="4" fill="#000000" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
      <line x1="6" y1="58" x2="6" y2="22" stroke="#30D158" stroke-width="2.5" />
      <line x1="6" y1="20" x2="6" y2="12" stroke="#FF9F0A" stroke-width="2.5" />
      <line x1="12" y1="58" x2="12" y2="26" stroke="#30D158" stroke-width="2.5" />
      <line x1="12" y1="24" x2="12" y2="16" stroke="#FF9F0A" stroke-width="2.5" />
    </g>
  </g>

  <!-- Dynamic Island -->
  <rect x="136" y="11" width="121" height="35" rx="17.5" fill="#000000" />
  <text x="52" y="32" font-family="-apple-system, SF Pro Text, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">9:41</text>

  <!-- Pro HUD Bar: Film Specs, Aspect Ratio, Gimbal Telemetry -->
  <g id="Top_Pro_HUD" transform="translate(16, 56)">
    <rect width="361" height="36" rx="18" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
    <!-- Gimbal Mode Pill -->
    <circle cx="20" cy="18" r="3.5" fill="#30D158" />
    <text x="32" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="700" fill="#30D158">PF</text>
    <line x1="52" y1="10" x2="52" y2="26" stroke="#FFFFFF" stroke-opacity="0.12" />

    <!-- Aspect Ratio Button -->
    <g transform="translate(60, 6)">
      <rect width="48" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="24" y="16" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">16:9</text>
    </g>

    <!-- Format & Exposure Telemetry -->
    <text x="145" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">4K 60</text>
    <text x="195" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" font-weight="700" fill="#FF9F0A">LOG</text>
    <text x="245" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" fill="#AEAEB2">1/120s</text>
    <text x="295" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" fill="#AEAEB2">ISO 100</text>

    <!-- UI Switcher Quick Gear -->
    <line x1="335" y1="10" x2="335" y2="26" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="348" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">⚙️</text>
  </g>

  <!-- Pro Zoom Selector (4 Focal Lengths) -->
  <g id="Zoom_Pill_Pro" transform="translate(116, 610)">
    <rect width="161" height="36" rx="18" fill="#000000" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
    <text x="26" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">.5</text>
    <circle cx="70" cy="18" r="13" fill="#FF9F0A" />
    <text x="70" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">1x</text>
    <text x="110" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">2</text>
    <text x="142" y="22" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">5</text>
  </g>

  <!-- Pro Bottom Dock -->
  <g id="Bottom_Dock_Pro">
    <rect x="0" y="660" width="393" height="192" fill="#000000" />

    <g id="Mode_Carousel_Pro" transform="translate(0, 688)">
      <text x="60" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">SLO-MO</text>
      <text x="145" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="700" fill="#FF9F0A" text-anchor="middle">VIDEO</text>
      <circle cx="145" cy="8" r="2" fill="#FF9F0A" />
      <text x="235" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">PHOTO</text>
      <text x="325" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">PRO CINEMA</text>
    </g>

    <g transform="translate(0, 715)">
      <!-- Gallery Thumbnail -->
      <g transform="translate(26, 10)">
        <rect width="48" height="48" rx="12" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <rect x="3" y="3" width="42" height="42" rx="9" fill="url(#skyDark)" />
        <rect x="3" y="30" width="42" height="15" rx="3" fill="#000000" fill-opacity="0.6" />
        <text x="24" y="41" font-family="-apple-system, SF Pro Text, sans-serif" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">00:18</text>
      </g>

      <!-- Rotate 90° -->
      <g transform="translate(100, 10)">
        <circle cx="24" cy="24" r="24" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <rect x="17" y="14" width="14" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.6" />
        <path d="M 12 17 L 12 12 L 17 12" fill="none" stroke="#FF9F0A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="24" y="43" font-family="-apple-system, SF Pro Text, sans-serif" font-size="7" font-weight="700" fill="#FF9F0A" text-anchor="middle">90°</text>
      </g>

      <!-- Shutter REC -->
      <g transform="translate(160, -3)">
        <rect x="4" y="-12" width="66" height="16" rx="8" fill="#FF453A" fill-opacity="0.18" />
        <text x="37" y="0" font-family="-apple-system, SF Pro Text, sans-serif" font-size="9" font-weight="700" fill="#FF453A" text-anchor="middle">00:04:18</text>
        <circle cx="37" cy="37" r="36" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
        <rect x="17" y="17" width="40" height="40" rx="10" fill="url(#shutterRed)" />
      </g>

      <!-- Flip Cam -->
      <g transform="translate(245, 10)">
        <circle cx="24" cy="24" r="24" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <path d="M 15 22 C 15 17, 19 14, 25 14 C 30 14, 33 17, 33 21" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
        <polyline points="30,19 33,22 36,19" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 33 26 C 33 31, 29 34, 23 34 C 18 34, 15 31, 15 27" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
        <polyline points="18,29 15,26 12,29" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Aspect Ratio Quick Switcher -->
      <g transform="translate(320, 10)">
        <circle cx="24" cy="24" r="24" fill="#1C1C1E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <rect x="15" y="17" width="18" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="24" y="42" font-family="-apple-system, SF Pro Text, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">16:9</text>
      </g>
    </g>

    <rect x="127" y="836" width="139" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>
</svg>