<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – Tài khoản Apple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      background: #F5F5F7;
      color: #1D1D1F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .apple-card {
      background: #FFFFFF;
      border: 1px solid #D2D2D7;
      border-radius: 26px;
      width: 100%;
      max-width: 430px;
      padding: 38px 34px 32px 34px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    .apple-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #1D1D1F;
      color: #FFFFFF;
      margin: 0 auto 18px auto;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: #1D1D1F;
    }
    .sub-text {
      font-size: 13.5px;
      color: #4B5563;
      text-align: center;
      margin-bottom: 24px;
    }
    .input-group { margin-bottom: 16px; }
    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: #1D1D1F;
      display: block;
      margin-bottom: 6px;
    }
    .apple-input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #86868B;
      border-radius: 12px;
      font-size: 14.5px;
      font-family: inherit;
      color: #1D1D1F;
      outline: none;
    }
    .apple-input:focus {
      border-color: #0071E3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.14);
    }
    .btn-apple-submit {
      width: 100%;
      padding: 13px;
      background: #1D1D1F;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-apple-submit:hover { background: #000000; }
    .err-msg {
      display: none;
      font-size: 12px;
      color: #DC2626;
      margin-top: 6px;
    }
    .note {
      font-size: 12px;
      color: #6B7280;
      text-align: center;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="apple-card">
    <div class="apple-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
    </div>
    <h1>Đăng nhập bằng Apple</h1>
    <div class="sub-text">Tiếp tục tới <strong>T-Flow</strong> &amp; đồng bộ tài khoản iOS</div>

    <form onsubmit="handleAppleSubmit(event)">
      <div class="input-group">
        <label class="input-label" for="appleEmail">Email hoặc Apple ID</label>
        <input type="email" id="appleEmail" class="apple-input" placeholder="ten.ban@icloud.com" autocomplete="username" autofocus required>
        <div class="err-msg" id="appleEmailError">Vui lòng nhập email Apple ID hợp lệ.</div>
      </div>

      <div class="input-group">
        <label class="input-label" for="appleName">Tên hiển thị</label>
        <input type="text" id="appleName" class="apple-input" placeholder="Ví dụ: Nguyễn Minh Anh" autocomplete="name">
      </div>

      <div class="input-group">
        <label class="input-label" for="applePassword">Mật khẩu Apple ID</label>
        <input type="password" id="applePassword" class="apple-input" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password" required>
        <div class="err-msg" id="applePassError">Mật khẩu cần tối thiểu 6 ký tự.</div>
      </div>

      <button type="submit" class="btn-apple-submit" id="btnAppleSubmit">Tiếp tục với Apple</button>
    </form>

    <div class="note">
      Tài khoản Apple ID được đồng bộ hai chiều với ứng dụng T-Flow trên iPhone qua Supabase Cloud.
    </div>
  </div>

  <script>
    function handleAppleSubmit(e) {
      e.preventDefault();
      var emailEl = document.getElementById('appleEmail');
      var nameEl = document.getElementById('appleName');
      var passEl = document.getElementById('applePassword');
      var emailErr = document.getElementById('appleEmailError');
      var passErr = document.getElementById('applePassError');
      emailErr.style.display = 'none';
      passErr.style.display = 'none';

      var email = (emailEl.value || '').trim();
      var pass = passEl.value || '';
      if (!email || !email.includes('@')) {
        emailErr.style.display = 'block';
        emailEl.focus();
        return;
      }
      if (pass.length < 6) {
        passErr.style.display = 'block';
        passEl.focus();
        return;
      }

      var displayName = (nameEl.value || '').trim();
      if (!displayName) {
        var prefix = email.split('@')[0];
        displayName = email.toLowerCase().includes('thuynguyen')
          ? 'Thuy Nguyen'
          : prefix.replace(/[._0-9]/g, ' ').trim();
        if (displayName) displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
      }

      var payload = {
        type: 'APPLE_OAUTH_SUCCESS',
        user: {
          email: email,
          name: displayName || email.split('@')[0],
          avatar: (displayName || email).charAt(0).toUpperCase(),
          provider: 'apple'
        }
      };

      var btn = document.getElementById('btnAppleSubmit');
      btn.disabled = true;
      btn.textContent = 'Đang xác thực Apple ID...';

      setTimeout(function() {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
          window.close();
        } else {
          try {
            localStorage.setItem('tflow_apple_auth_redirect_user', JSON.stringify(payload.user));
          } catch (err) {}
          window.location.href = '/';
        }
      }, 450);
    }
  </script>
</body>
</html>
